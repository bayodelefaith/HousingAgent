<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0D080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9A6F2A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D1A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="420" height="120" rx="8" fill="url(#darkGrad)"/>

  <!-- House icon mark -->
  <!-- Roof -->
  <polygon points="45,62 72,35 99,62" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left chimney -->
  <rect x="54" y="41" width="6" height="12" fill="url(#goldGrad)" rx="1"/>
  <!-- House body -->
  <rect x="51" y="61" width="42" height="28" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" rx="1"/>
  <!-- Door -->
  <rect x="65" y="72" width="14" height="17" fill="none" stroke="url(#goldGrad)" stroke-width="2" rx="2"/>
  <!-- Door knob -->
  <circle cx="76" cy="81" r="1.5" fill="url(#goldGrad)"/>
  <!-- Windows -->
  <rect x="54" y="68" width="8" height="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="1"/>
  <rect x="82" y="68" width="8" height="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="1"/>

  <!-- Thin gold divider line -->
  <line x1="118" y1="30" x2="118" y2="90" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

  <!-- LUXE wordmark -->
  <text x="135" y="63"
    font-family="'Garamond', 'Georgia', 'Times New Roman', serif"
    font-size="38"
    font-weight="400"
    letter-spacing="10"
    fill="url(#goldGrad)">LUXE</text>

  <!-- HOUSING subtext -->
  <text x="137" y="83"
    font-family="'Garamond', 'Georgia', 'Times New Roman', serif"
    font-size="14"
    font-weight="300"
    letter-spacing="8"
    fill="#C9A84C"
    opacity="0.85">HOUSING</text>

  <!-- Decorative thin lines flanking HOUSING -->
  <line x1="137" y1="87" x2="137" y2="87" stroke="url(#goldGrad)" stroke-width="1"/>
  <line x1="135" y1="92" x2="280" y2="92" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
  <line x1="135" y1="51" x2="280" y2="51" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
</svg>
